name: Suggestion
description: An idea for QuestShare, or something that could work better.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: The situation in game (questing solo or in a party, which zone, what got in the way).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, and anything another addon already does well here.
    validations:
      required: true
