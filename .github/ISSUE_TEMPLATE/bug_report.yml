name: Bug report
description: Something in QuestShare doesn't work or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the open issues first; if yours is there, comment on it instead.
  - type: input
    id: version
    attributes:
      label: QuestShare version
      description: Shown in the CurseForge app, or in the addon list on the character screen.
      placeholder: 0.5.6-beta
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Solo or in a party? In combat?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: Steps, the quest or zone involved, and how often it happens. Does `/reload` make it go away?
  - type: textarea
    id: compat
    attributes:
      label: Output of /qshare compat
      description: Type `/qshare compat` in game and copy the lines (or attach a screenshot of the chat).
      render: text
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Lua errors and screenshots
      description: Any error from BugSack or the game's error window, and screenshots. Drag files in here.
